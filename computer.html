<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computers' World</title>
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #d4b15f;
            color: #333;
        }
        /* Header styles */
        header {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 14px;
        }
        /* Main title and tabs */
        .title {
            text-align: center;
            margin-top: 20px;
        }
        .title h1 {
            font-size: 2em;
            color: #a32d2b;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            font-size: 1.5em;
        }
        .tabs a {
            text-decoration: none;
            color: #2a6b9e;
            cursor: pointer;
        }
        /* Content area styles */
        .content {
            display: none;
            padding: 20px;
            text-align: center;
        }
        .content.active {
            display: block;
        }
        /* Image styling */
        .image-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .image-container img {
            width: 300px;
            height: auto;
        }
    </style>
</head>
<body>

<header>
    <span>ADDRESS</span>
    <span>PHONE</span>
    <span>EMAIL</span>
    <span>SEARCH</span>
</header>
